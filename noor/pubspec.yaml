name: noor
description: "Noor (نور) - Complete Offline-First Islamic Companion App in Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Networking & Offline Caching
  dio: ^5.4.3+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Audio Playback & Background Caching
  just_audio: ^0.9.38
  audio_session: ^0.1.21

  # Prayer Times, Location & Qibla Sensors
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_qiblah: ^3.0.3
  flutter_compass: ^0.8.0
  adhan_dart: ^1.1.0
  hijri: ^3.0.0

  # Background Notifications, Scheduling & Home Screen Widget
  flutter_local_notifications: ^17.2.1+2
  workmanager: ^0.5.2
  timezone: ^0.9.4
  home_widget: ^0.6.0
  permission_handler: ^11.3.1

  # UI, Sharing & Localization
  intl: ^0.19.0
  share_plus: ^9.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/azkar.json
    - assets/data/hadith_nawawi_40.json
    - assets/data/surah_index.json
    - assets/audio/
