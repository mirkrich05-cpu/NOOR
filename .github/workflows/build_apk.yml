name: Build Noor Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & scaffolding
        working-directory: noor
        run: |
          flutter create --org com.noor.islamic .
          flutter pub get

      - name: Run verification test
        working-directory: noor
        run: flutter test test/noor_test.dart

      - name: Build Android Release APK
        working-directory: noor
        run: flutter build apk --release

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: noor/build/app/outputs/flutter-apk/app-release.apk
