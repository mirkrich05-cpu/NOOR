name: Build Noor Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate missing platform wrappers & fetch packages
        run: |
          flutter create --org com.noor.islamic .
          flutter pub get
      - name: Run tests & build release APK
        run: |
          flutter test test/noor_test.dart
          flutter build apk --release
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
